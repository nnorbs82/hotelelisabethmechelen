name: Validate careers and legal milestone
on:
  push:
    branches: [elisabeth-redesign]
    paths: ['.github/workflows/validate-careers-legal.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0
      - name: Connect Careers and legal links
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
            'href="index.html#careers"':'href="careers.html"',
            'href="../privacypolicy.html"':'href="privacy.html"',
            'href="../termsandconditions.html"':'href="terms.html"',
            '<a href="#">Hotel policies</a>':'<a data-site-link href="policies.html">Hotel policies</a>',
            '<a href="#">Privacy policy</a>':'<a data-site-link href="privacy.html">Privacy policy</a>',
            '<a href="#">Terms &amp; conditions</a>':'<a data-site-link href="terms.html">Terms &amp; conditions</a>',
            '<a href="#">Terms & conditions</a>':'<a data-site-link href="terms.html">Terms & conditions</a>'
          }
          for path in Path('redesign-site').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              for old,new in replacements.items(): text=text.replace(old,new)
              path.write_text(text,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          for f in redesign-site/assets/*.js; do node --check "$f"; done
      - name: Validate pages and source content
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re
          pages=['careers.html','policies.html','privacy.html','terms.html','index.html','rooms.html','facilities.html','packages.html','meetings.html','info.html','attractions.html','grouprequest.html']
          for name in pages:
              p=Path('redesign-site')/name
              if not p.exists(): raise SystemExit('Missing '+str(p))
              html=p.read_text(encoding='utf-8')
              HTMLParser().feed(html)
              if 'noindex,nofollow' not in html.replace(' ',''): raise SystemExit('Missing noindex: '+name)
              for attr,val in re.findall(r'\b(src|href)=["\']([^"\']+)["\']',html,re.I):
                  if val.startswith(('#','http://','https://','mailto:','tel:','data:')): continue
                  local=(p.parent/val.split('?',1)[0].split('#',1)[0]).resolve()
                  if val and not local.exists(): raise SystemExit(f'Missing local reference in {name}: {val}')
          privacy=json.loads(Path('redesign/legacy-content/privacyPolicy.json').read_text())
          terms=json.loads(Path('redesign/legacy-content/termsAndConditions.json').read_text())
          for lang in ['en','nl','fr']:
              if not privacy.get(lang): raise SystemExit('Missing privacy '+lang)
              if not terms.get(lang): raise SystemExit('Missing terms '+lang)
          info=json.loads(Path('redesign/legacy-content/hotelInfo.json').read_text())
          if len(info)!=10: raise SystemExit('Expected 10 hotelInfo policy blocks')
          careers=json.loads(Path('redesign/legacy-content/careers.json').read_text()) if Path('redesign/legacy-content/careers.json').read_text().strip()!='null' else None
          print('Careers source currently has no active Firebase data' if not careers else f'Careers records: {len(careers)}')
          for token in ['career-list','careers-empty']:
              if token not in Path('redesign-site/careers.html').read_text(): raise SystemExit('Missing Careers hook '+token)
          for token in ['policy-index','policy-title','policy-copy']:
              if token not in Path('redesign-site/policies.html').read_text(): raise SystemExit('Missing policy hook '+token)
          for name in ['privacy.html','terms.html']:
              html=Path('redesign-site',name).read_text()
              for token in ['legal-content','legal-aside-links','legal-progress']:
                  if token not in html: raise SystemExit(f'Missing {token} in {name}')
          print('Careers/legal milestone validation passed')
          PY
      - name: Guard production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"
      - name: Remove one-time workflow
        run: rm .github/workflows/validate-careers-legal.yml
      - name: Commit validated milestone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: connect and validate careers and legal pages'
          git push origin HEAD:elisabeth-redesign
