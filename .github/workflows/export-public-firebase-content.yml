name: Snapshot public Firebase content

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/export-public-firebase-content.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Fetch public content only
        run: |
          set -euo pipefail
          BASE='https://hotelelisabethmechelen-9dd98-default-rtdb.europe-west1.firebasedatabase.app'
          mkdir -p redesign/legacy-content
          paths=(
            mainBanner indexAds indexBackground aboutUs adsBottom packages
            facilities facilitiesHero facilitiesLibrary
            attractions attractionsMainImage
            hotelInfo rooms amenitiesMaster amenities
            meetings meetingsPhotos groupMainImage careers
            privacyPolicy termsAndConditions translations
          )
          for p in "${paths[@]}"; do
            echo "Fetching $p"
            curl --fail-with-body --silent --show-error --retry 2 "$BASE/$p.json" -o "redesign/legacy-content/$p.json" || {
              echo 'null' > "redesign/legacy-content/$p.json"
              echo "WARNING: $p could not be read anonymously"
            }
          done

      - name: Validate and summarize export
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          folder=Path('redesign/legacy-content')
          summary={}
          for path in sorted(folder.glob('*.json')):
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(f'Invalid JSON in {path}: {exc}')
              if isinstance(data, dict):
                  summary[path.stem]={"status":"ok","type":"object","items":len(data),"top_level_keys":list(data.keys())[:30]}
              elif isinstance(data, list):
                  summary[path.stem]={"status":"ok","type":"array","items":len(data)}
              elif data is None:
                  summary[path.stem]={"status":"unavailable","type":"null","items":0}
              else:
                  summary[path.stem]={"status":"ok","type":type(data).__name__,"items":1}
          (folder/'_export-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/export-public-firebase-content.yml

      - name: Commit public migration snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign/legacy-content .github/workflows/export-public-firebase-content.yml
          git commit -m 'migration: snapshot public Firebase hotel content'
          git push origin HEAD:elisabeth-redesign
