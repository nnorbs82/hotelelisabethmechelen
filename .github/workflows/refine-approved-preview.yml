name: Refine approved Elisabeth preview

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/refine-approved-preview.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0
      - name: Apply refinements
        run: python tools/refine_preview.py
      - name: Validate JavaScript
        run: node --check design-preview-v2.js
      - name: Validate preview state
        run: |
          python -c "from pathlib import Path; h=Path('design-preview-v2.html').read_text(); assert 'noindex,nofollow' in h.replace(' ',''); assert 'transition-scene' in h; assert 'facts.doorstep' in h; assert '<img class=\"hero-logo\"' not in h"
      - name: Remove temporary files
        run: rm .github/workflows/refine-approved-preview.yml tools/refine_preview.py
      - name: Commit refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'design: refine approved Elisabeth direction'
          git push origin HEAD:elisabeth-redesign
