name: Validate distinct facilities and packages designs

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/validate-distinct-page-designs.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Validate scripts
        run: |
          node --check redesign-site/assets/facilities.js
          node --check redesign-site/assets/packages.js

      - name: Validate HTML and design hooks
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          pages=['redesign-site/facilities.html','redesign-site/packages.html']
          for path in pages:
              text=Path(path).read_text(encoding='utf-8')
              HTMLParser().feed(text)
              if 'noindex,nofollow' not in text.replace(' ',''):
                  raise SystemExit(f'noindex missing: {path}')

          facility_html=Path('redesign-site/facilities.html').read_text(encoding='utf-8')
          package_html=Path('redesign-site/packages.html').read_text(encoding='utf-8')
          facility_js=Path('redesign-site/assets/facilities.js').read_text(encoding='utf-8')
          package_js=Path('redesign-site/assets/packages.js').read_text(encoding='utf-8')
          css=Path('redesign-site/assets/content-pages.css').read_text(encoding='utf-8')

          required={
              'facility HTML':['facilities-opening','facility-explorer'],
              'facility JS':['facility-console','data-facility-select','data-facility-nav'],
              'package HTML':['packages-opening','package-deck','package-name-rail'],
              'package JS':['package-campaign','package-ticket','package-campaign-number'],
              'CSS':['.facility-console{','.package-campaign{','position:sticky','@keyframes packageRail']
          }
          blobs={'facility HTML':facility_html,'facility JS':facility_js,'package HTML':package_html,'package JS':package_js,'CSS':css}
          for label,tokens in required.items():
              for token in tokens:
                  if token not in blobs[label]:
                      raise SystemExit(f'Missing {label} token: {token}')

          for path in pages:
              html=Path(path).read_text(encoding='utf-8')
              for _,value in re.findall(r'\b(src|href)=["\']([^"\']+)["\']',html,re.I):
                  if value.startswith(('#','http://','https://','mailto:','tel:','data:')):
                      continue
                  local=(Path(path).parent/value.split('?',1)[0].split('#',1)[0]).resolve()
                  if not local.exists():
                      raise SystemExit(f'Missing local reference in {path}: {value}')
          print('Distinct page design validation passed')
          PY

      - name: Guard production branch
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time workflow
        run: rm .github/workflows/validate-distinct-page-designs.yml

      - name: Commit validation cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: complete distinct page design validation'
          git push origin HEAD:elisabeth-redesign
