name: Add room dialog gallery navigation

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/add-room-dialog-gallery-nav.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Add main-image gallery controls
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('redesign-site/assets/rooms.js')
          js = js_path.read_text(encoding='utf-8')

          old = '''          <div class="room-dialog-main"><img src="${escape(image)}" alt="${escape(name)}" id="room-dialog-main-image"></div>'''
          new = '''          <div class="room-dialog-main">
            <img src="${escape(image)}" alt="${escape(name)}" id="room-dialog-main-image">
            ${images.length>1 ? `<div class="room-dialog-main-nav" aria-label="Room gallery navigation">
              <div class="room-dialog-counter" aria-live="polite"><span data-dialog-current>${String(activeDialogPhoto+1).padStart(2,'0')}</span><span class="room-dialog-counter-sep">/</span><span data-dialog-total>${String(images.length).padStart(2,'0')}</span></div>
              <div class="room-dialog-main-controls"><button type="button" data-dialog-nav="prev" aria-label="Previous photo">←</button><button type="button" data-dialog-nav="next" aria-label="Next photo">→</button></div>
            </div>` : ''}
          </div>'''
          if old not in js:
              raise SystemExit('Could not find room-dialog-main markup anchor')
          js = js.replace(old, new, 1)

          old_show = '''    const main = document.getElementById('room-dialog-main-image');
    if (main) main.src = images[activeDialogPhoto].url;
    document.querySelectorAll('[data-dialog-photo]').forEach((button,i)=>button.classList.toggle('active',i===activeDialogPhoto));'''
          new_show = '''    const main = document.getElementById('room-dialog-main-image');
    if (main) main.src = images[activeDialogPhoto].url;
    const current = document.querySelector('[data-dialog-current]');
    if (current) current.textContent = String(activeDialogPhoto+1).padStart(2,'0');
    document.querySelectorAll('[data-dialog-photo]').forEach((button,i)=>button.classList.toggle('active',i===activeDialogPhoto));
    const activeThumb = document.querySelector(`[data-dialog-photo="${activeDialogPhoto}"]`);
    activeThumb?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});'''
          if old_show not in js:
              raise SystemExit('Could not find showDialogPhoto anchor')
          js = js.replace(old_show, new_show, 1)

          old_click = '''    const opener=event.target.closest('[data-open-room]');
    if(opener){openRoom(opener.dataset.openRoom);return;}
    if(event.target.closest('[data-close-room]')){closeRoom();return;}
    const thumb=event.target.closest('[data-dialog-photo]');'''
          new_click = '''    const opener=event.target.closest('[data-open-room]');
    if(opener){openRoom(opener.dataset.openRoom);return;}
    if(event.target.closest('[data-close-room]')){closeRoom();return;}
    const dialogNav=event.target.closest('[data-dialog-nav]');
    if(dialogNav){showDialogPhoto(activeDialogPhoto+(dialogNav.dataset.dialogNav==='next'?1:-1));return;}
    const thumb=event.target.closest('[data-dialog-photo]');'''
          if old_click not in js:
              raise SystemExit('Could not find dialog click handler anchor')
          js = js.replace(old_click, new_click, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('redesign-site/assets/site.css')
          css = css_path.read_text(encoding='utf-8')
          anchor = '.room-dialog-main{position:absolute;inset:0 0 112px}.room-dialog-main img{width:100%;height:100%;object-fit:contain;background:#090a09}\n'
          addition = '''.room-dialog-main{position:absolute;inset:0 0 112px}.room-dialog-main img{width:100%;height:100%;object-fit:contain;background:#090a09}
.room-dialog-main-nav{position:absolute;z-index:4;right:20px;bottom:20px;display:flex;align-items:center;gap:8px}
.room-dialog-counter{height:48px;min-width:88px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid rgba(255,255,255,.52);background:rgba(7,8,7,.58);color:#fff;backdrop-filter:blur(12px);font-family:var(--display);font-size:11px;font-weight:500;letter-spacing:.12em}
.room-dialog-counter-sep{opacity:.45}
.room-dialog-main-controls{display:flex;gap:7px}
.room-dialog-main-controls button{width:48px;height:48px;border:1px solid rgba(255,255,255,.55);background:rgba(7,8,7,.58);color:#fff;cursor:pointer;font-size:17px;backdrop-filter:blur(12px);transition:background .25s ease,color .25s ease,transform .25s ease}
.room-dialog-main-controls button:hover{background:#fff;color:var(--black);transform:translateY(-1px)}
'''
          if anchor not in css:
              raise SystemExit('Could not find dialog CSS anchor')
          css = css.replace(anchor, addition, 1)

          mobile = '  .room-dialog-panel{width:100%;margin:0;min-height:100vh}.room-dialog-gallery{height:57vh}.room-dialog-main{bottom:94px}.room-dialog-thumbs{height:94px}.room-dialog-thumb{width:96px;flex-basis:96px}.room-dialog-thumb img{height:70px}.room-dialog-copy{padding:48px 22px 70px}.room-dialog-close{top:14px;right:14px}\n'
          mobile_new = '  .room-dialog-panel{width:100%;margin:0;min-height:100vh}.room-dialog-gallery{height:57vh}.room-dialog-main{bottom:94px}.room-dialog-main-nav{right:12px;bottom:12px;gap:6px}.room-dialog-counter{height:44px;min-width:76px;padding:0 10px}.room-dialog-main-controls{gap:6px}.room-dialog-main-controls button{width:44px;height:44px}.room-dialog-thumbs{height:94px}.room-dialog-thumb{width:96px;flex-basis:96px}.room-dialog-thumb img{height:70px}.room-dialog-copy{padding:48px 22px 70px}.room-dialog-close{top:14px;right:14px}\n'
          if mobile not in css:
              raise SystemExit('Could not find mobile dialog CSS anchor')
          css = css.replace(mobile, mobile_new, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Validate gallery navigation
        run: |
          node --check redesign-site/assets/rooms.js
          python - <<'PY'
          from pathlib import Path
          js=Path('redesign-site/assets/rooms.js').read_text(encoding='utf-8')
          css=Path('redesign-site/assets/site.css').read_text(encoding='utf-8')
          required_js=['data-dialog-nav="prev"','data-dialog-nav="next"','data-dialog-current','scrollIntoView']
          required_css=['.room-dialog-main-nav','.room-dialog-counter','.room-dialog-main-controls button']
          for token in required_js:
              if token not in js: raise SystemExit('Missing JS gallery token: '+token)
          for token in required_css:
              if token not in css: raise SystemExit('Missing CSS gallery token: '+token)
          print('Room dialog gallery navigation validated')
          PY

      - name: Guard production branch
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time workflow
        run: rm .github/workflows/add-room-dialog-gallery-nav.yml

      - name: Commit gallery navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/assets/rooms.js redesign-site/assets/site.css .github/workflows/add-room-dialog-gallery-nav.yml
          git commit -m 'design: add room dialog gallery navigation'
          git push origin HEAD:elisabeth-redesign
