name: Apply core ES and DE translations

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/apply-core-es-de-translations.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Apply translated content
        run: python tools/apply_core_es_de_translations.py

      - name: Rebuild browser content indexes
        run: python tools/build_redesign_content.py

      - name: Validate translated fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('redesign-site/content')
          for folder in ['amenities','facilities','meetings']:
              for path in (base/folder).glob('*.json'):
                  item=json.loads(path.read_text(encoding='utf-8'))
                  for lang in ['es','de']:
                      if folder=='amenities':
                          keys=[f'name_{lang}']
                      elif folder=='facilities':
                          keys=[f'name_{lang}',f'operation_{lang}',f'guidelines_{lang}']
                      else:
                          keys=[f'name_{lang}',f'description_{lang}',f'facilities_{lang}',f'food_{lang}',f'parking_{lang}',f'accommodation_{lang}',f'setupStyles_{lang}']
                      for key in keys:
                          value=item.get(key)
                          if value in (None,'',[]): raise SystemExit(f'Missing {key} in {path}')
          info=json.loads((base/'hotel-info.json').read_text(encoding='utf-8'))
          for entry in info['entries']:
              if entry['id']=='fooddrinks': continue
              for lang in ['es','de']:
                  if not entry.get(f'body_{lang}'): raise SystemExit(f"Missing {lang} info for {entry['id']}")
          generated=base/'generated'
          for name in ['amenitiesMaster.json','facilities.json','meetings.json','hotelInfo.json']:
              json.loads((generated/name).read_text(encoding='utf-8'))
          print('Core Spanish and German hotel content validated')
          PY

      - name: Guard production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time translation files
        run: rm .github/workflows/apply-core-es-de-translations.yml tools/apply_core_es_de_translations.py

      - name: Commit translated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/content .github/workflows/apply-core-es-de-translations.yml tools/apply_core_es_de_translations.py
          git commit -m 'content: add core Spanish and German hotel translations'
          git push origin HEAD:elisabeth-redesign
