name: Run room dialog gallery navigation patch

on:
  push:
    branches:
      - elisabeth-redesign
    paths:
      - .github/workflows/run-room-dialog-gallery-nav.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/add_room_dialog_gallery_nav.py
      - name: Validate JavaScript
        run: node --check redesign-site/assets/rooms.js
      - name: Guard production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"
      - name: Clean temporary files
        run: rm -f .github/workflows/add-room-dialog-gallery-nav.yml .github/workflows/run-room-dialog-gallery-nav.yml .github/scripts/add_room_dialog_gallery_nav.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'design: add room dialog gallery navigation'
          git push origin HEAD:elisabeth-redesign
