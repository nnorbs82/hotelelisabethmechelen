name: Align Hotel Information once

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/align-hotel-info-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Align guest-facing hotel information
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('redesign-site/content/hotel-info.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          by_id = {entry['id']: entry for entry in data['entries']}

          services = by_id['services']
          service_text = {
              'en': '- 24-hour front desk\n- Luggage storage\n- Wi-Fi\n- Breakfast buffet\n- Bar\n- Underground parking\n- Indoor pool - daily 07:00-23:00\n- Spa - opening soon',
              'nl': '- 24-uursreceptie\n- Bagageopslag\n- WiFi\n- Ontbijtbuffet\n- Bar\n- Ondergrondse parking\n- Binnenzwembad - dagelijks 07:00-23:00\n- Spa - binnenkort geopend',
              'fr': '- Réception ouverte 24h/24\n- Consigne à bagages\n- Wi-Fi\n- Petit-déjeuner buffet\n- Bar\n- Parking souterrain\n- Piscine intérieure - tous les jours de 07h00 à 23h00\n- Spa - ouverture prochaine',
              'es': '- Recepción 24 horas\n- Consigna de equipaje\n- Wi-Fi\n- Desayuno buffet\n- Bar\n- Aparcamiento subterráneo\n- Piscina interior - todos los días de 07:00 a 23:00\n- Spa - próxima apertura',
              'de': '- 24-Stunden-Rezeption\n- Gepäckaufbewahrung\n- WLAN\n- Frühstücksbuffet\n- Bar\n- Tiefgarage\n- Innenpool - täglich von 07:00 bis 23:00 Uhr\n- Spa - Eröffnung in Kürze',
          }
          for lang, text in service_text.items():
              services[f'body_{lang}'] = text

          general = by_id['general']
          general_text = {
              'en': '- Non-smoking rooms\n- Accessible facilities for guests with reduced mobility\n- Family rooms and suites\n- Olive-tree courtyard and terrace\n- Meeting rooms\n- Central location in Mechelen',
              'nl': '- Rookvrije kamers\n- Toegankelijke faciliteiten voor gasten met beperkte mobiliteit\n- Familiekamers en suites\n- Olijfboom-binnenplaats en terras\n- Vergaderruimtes\n- Centrale ligging in Mechelen',
              'fr': '- Chambres non-fumeurs\n- Installations accessibles aux personnes à mobilité réduite\n- Chambres familiales et suites\n- Cour et terrasse aux oliviers\n- Salles de réunion\n- Emplacement central à Malines',
              'es': '- Habitaciones para no fumadores\n- Instalaciones accesibles para huéspedes con movilidad reducida\n- Habitaciones familiares y suites\n- Patio y terraza de los olivos\n- Salas de reuniones\n- Ubicación céntrica en Malinas',
              'de': '- Nichtraucherzimmer\n- Barrierearme Einrichtungen für Gäste mit eingeschränkter Mobilität\n- Familienzimmer und Suiten\n- Olivenbaum-Innenhof und Terrasse\n- Tagungsräume\n- Zentrale Lage in Mechelen',
          }
          for lang, text in general_text.items():
              general[f'body_{lang}'] = text

          traffic = by_id['traffic']
          for lang in ('en','nl','es','de'):
              traffic[f'body_{lang}'] = traffic[f'body_{lang}'].replace('ttps://www.mechelen.be/autoluw', 'https://www.mechelen.be/autoluw')
          traffic['body_fr'] = traffic['body_fr'].replace('11h – 6h', '11h – 18h')

          camera = by_id['camera']
          camera['body_en'] = 'At the beginning of each low-traffic or car-free street or zone, you will see a traffic sign indicating that passage is prohibited during certain hours except for permit holders.\n\nThe zone is identified by traffic sign C3 with the applicable exceptions listed below it. If you pass this sign during restricted hours without authorization, the camera will register your number plate and you may receive a €58 fine.'
          camera['body_nl'] = 'Aan het begin van elke autoluwe/autovrije straat of zone staat een verkeersbord dat de doorgang tijdens bepaalde uren verbiedt, behalve voor vergunninghouders.\n\nDe zone is herkenbaar aan verkeersbord C3 met daaronder de uitzonderingen. Passeert u dit bord tijdens de autoluwe uren zonder vergunning, dan registreert de camera uw nummerplaat en ontvangt u een boete van €58.'
          camera['body_fr'] = 'Au début de chaque rue ou zone à circulation limitée ou interdite aux voitures, un panneau indique que le passage est interdit pendant certaines heures, sauf pour les titulaires d’une autorisation.\n\nLa zone est signalée par le panneau C3, accompagné de la liste des exceptions. Si vous franchissez ce panneau pendant les heures de restriction sans autorisation, la caméra enregistrera votre plaque d’immatriculation et vous pourrez recevoir une amende de 58 €.'

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          info_js = Path('redesign-site/assets/info.js')
          text = info_js.read_text(encoding='utf-8')
          replacements = {
              "Everything useful for your stay, organised like a concierge desk - quick to scan, easy to return to, and based on the hotel information already published today.": "Find check-in and check-out times, breakfast hours, parking details, low-traffic access, hotel services and payment information in one place.",
              "Alles wat nuttig is voor uw verblijf, georganiseerd als een conciërgebalie - snel te raadplegen, makkelijk terug te vinden en gebaseerd op de huidige hotelinformatie.": "Vind hier in één overzicht de check-in- en check-outtijden, ontbijturen, parkinginformatie, toegang tot de autoluwe zone, hoteldiensten en betaalinformatie.",
              "Toutes les informations utiles pour votre séjour, organisées comme un comptoir de conciergerie - rapides à consulter et basées sur les informations actuelles de l’hôtel.": "Retrouvez au même endroit les heures d’arrivée et de départ, les horaires du petit-déjeuner, le parking, l’accès à la zone à trafic limité, les services de l’hôtel et les moyens de paiement.",
              "Toda la información útil para tu estancia, organizada como una conserjería - rápida de consultar y basada en la información actual del hotel.": "Consulta en un solo lugar los horarios de llegada y salida, el desayuno, el aparcamiento, el acceso a la zona de tráfico restringido, los servicios del hotel y las formas de pago.",
              "Alle wichtigen Informationen für Ihren Aufenthalt, wie an einem Concierge-Schalter organisiert - schnell zu erfassen und auf den aktuellen Hotelinformationen basierend.": "Hier finden Sie Check-in- und Check-out-Zeiten, Frühstückszeiten, Parkinformationen, Hinweise zur verkehrsberuhigten Zone, Hotelservices und Zahlungsarten auf einen Blick.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected Info intro: {old[:40]}')
              text = text.replace(old, new)
          info_js.write_text(text, encoding='utf-8')
          PY

      - name: Commit alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/content/hotel-info.json redesign-site/assets/info.js
          git diff --cached --quiet && exit 0
          git commit -m 'content: align hotel information across languages'
          git push origin HEAD:elisabeth-redesign
