name: Meetings collage lightbox once

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/meetings-collage-lightbox-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0
      - name: Patch meetings layout
        run: python tools/patch_meetings_collage_lightbox.py
      - name: Check JavaScript
        run: node --check redesign-site/assets/meetings.js
      - name: Commit meetings layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/assets/meetings.js
          git diff --cached --quiet && exit 0
          git commit -m 'design: use compact meeting collages with fullscreen gallery'
          git push origin HEAD:elisabeth-redesign
