name: Validate revised design preview

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/validate-preview-v2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Validate JavaScript
        run: node --check design-preview-v2.js

      - name: Validate HTML and local references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          html = Path('design-preview-v2.html').read_text(encoding='utf-8')
          if 'noindex,nofollow' not in html.replace(' ', ''):
              raise SystemExit('Preview noindex is missing')

          class Parser(HTMLParser):
              pass
          Parser().feed(html)

          missing=[]
          for attr, value in re.findall(r'\b(src|href)=["\']([^"\']+)["\']', html, re.I):
              if value.startswith(('#','http://','https://','mailto:','tel:','data:')):
                  continue
              local=value.split('?',1)[0].split('#',1)[0].lstrip('/')
              if local and not Path(local).exists():
                  missing.append(local)
          if missing:
              raise SystemExit('Missing local references: ' + ', '.join(sorted(set(missing))))
          print('Preview validation passed')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/validate-preview-v2.yml

      - name: Commit validation cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: complete preview validation'
          git push origin HEAD:elisabeth-redesign
