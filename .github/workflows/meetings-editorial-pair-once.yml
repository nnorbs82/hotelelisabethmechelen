name: Meetings editorial pair once

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/meetings-editorial-pair-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0
      - name: Patch meetings layout
        run: python tools/patch_meetings_editorial_pair.py
      - name: Check JavaScript
        run: node --check redesign-site/assets/meetings.js
      - name: Commit meetings layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/assets/meetings.js
          git diff --cached --quiet && exit 0
          git commit -m 'design: show both meeting rooms in editorial pair'
          git push origin HEAD:elisabeth-redesign
