name: Tighten redesign validation once

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/tighten-redesign-validation-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Update redesign validator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate-redesign.yml')
          text = path.read_text(encoding='utf-8')

          old = '''          for legal_name in ['privacy.json','terms.json']:\n              legal=json.loads((content/legal_name).read_text(encoding='utf-8'))\n              for lang in ['en','nl','fr']:\n                  if not legal.get(lang): raise SystemExit(f'Missing {lang} content in {legal_name}')\n              missing=[lang for lang in ['es','de'] if not legal.get(lang)]\n              if missing:\n                  print(f'NOTICE: {legal_name} still requires reviewed translations for {missing}')\n'''
          new = '''          for legal_name in ['privacyPolicy.json','termsAndConditions.json']:\n              legal=json.loads((generated/legal_name).read_text(encoding='utf-8'))\n              for lang in ['en','nl','fr','es','de']:\n                  value=legal.get(lang)\n                  if not isinstance(value,str) or not value.strip():\n                      raise SystemExit(f'Missing generated {lang} content in {legal_name}')\n'''
          if old not in text:
              raise SystemExit('Expected legacy legal validation block not found')
          text = text.replace(old, new, 1)

          marker = '''      - name: Validate runtime architecture\n'''
          star_step = '''      - name: Validate no hotel star-rating claims\n        run: |\n          python - <<'PY'\n          import re\n          from pathlib import Path\n\n          patterns = [\n              r'4\\s*★',\n              r'4\\s*\\*',\n              r'4[- ]star',\n              r'four[- ]star',\n              r'viersterren',\n              r'quatre\\s+étoiles',\n              r'cuatro\\s+estrellas',\n              r'vier[- ]sterne',\n          ]\n          rx = re.compile('|'.join(patterns), re.I)\n          files = [Path('design-preview-v2.js')]\n          for suffix in ('*.html','*.js','*.json'):\n              files.extend(Path('redesign-site').rglob(suffix))\n          hits=[]\n          for file in files:\n              if not file.exists():\n                  continue\n              text=file.read_text(encoding='utf-8',errors='ignore')\n              match=rx.search(text)\n              if match:\n                  hits.append(f'{file}: {match.group(0)}')\n          if hits:\n              raise SystemExit('Hotel star-rating claim found:\\n' + '\\n'.join(hits))\n          print('No hotel star-rating claims found in active redesign content')\n          PY\n\n'''
          if marker not in text:
              raise SystemExit('Runtime validation marker not found')
          text = text.replace(marker, star_step + marker, 1)
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/tighten-redesign-validation-once.yml').unlink()
          PY

      - name: Commit validator update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-redesign.yml .github/workflows/tighten-redesign-validation-once.yml
          git commit -m 'ci: validate five-language legal content and no star claims'
          git push origin HEAD:elisabeth-redesign
