name: Polish redesign source copy once

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/polish-redesign-source-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Replace development-style guest copy
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'redesign-site/index.html': [
              ('Every active category keeps its real name, description, occupancy, bed configuration, size, amenities and photographs.', 'Choose from city rooms, courtyard stays, cathedral views, spacious suites and studios - each with its own character, comfort and view of Mechelen.'),
              ('Pool, courtyard, breakfast, underground parking and practical services remain visible, detailed and easy to explore.', 'Start the morning with breakfast, take a swim indoors, slow down in the courtyard or park beneath the hotel before heading into Mechelen.'),
              ('Offers presented like campaigns, not database cards.', 'A little more from your stay.'),
              ('Active Hotel Elisabeth offers are presented with their real imagery, inclusions and booking route.', 'Choose a Friday escape, a celebration package or a suite stay with extras such as breakfast, welcome drinks, pool access and late check-out.'),
              ('Meeting rooms, layouts, capacities, equipment, catering and the full quotation workflow stay together.', 'Two meeting rooms in central Mechelen with natural light, flexible setups, catering options and overnight accommodation when needed.'),
              ('Arrival, parking, breakfast, pool, access, services and policies will retain all of the current Hotel Elisabeth information in a clearer dedicated page.', 'Check-in times, parking, breakfast, pool access, payments and city traffic information - everything worth knowing before you arrive.'),
              ('The full existing group request - dates, guests, room mix, group type, meal option and message - remains part of the new website.', 'Planning several rooms? Share your dates, group size and preferred room mix and our team will prepare a proposal around your stay.'),
            ],
            'redesign-site/rooms.html': [
              ('From efficient city rooms to spacious suites and studios, move through the collection at your own pace.', 'From practical city rooms to cathedral views, studios and spacious suites, find the layout, bed and atmosphere that suit your stay in Mechelen.'),
              ('Scroll through the rooms as a collection rather than a catalogue. The photography, room facts and atmosphere change with each category, while the full gallery and detailed amenities remain one click away.', 'Some stays call for a simple city base, others for extra space, a kitchenette or a view of St Rumbold’s Cathedral. Explore the room types and choose what fits your trip.'),
              ('Prefer to compare the essentials? Scan occupancy, size and bed configuration here, then jump straight into the room you want to explore.', 'Compare guest capacity, room size and bed setup side by side, then open the room that best fits your stay.'),
              ('<span><strong>4★</strong><span>Hotel Elisabeth</span></span>', '<span><strong>1</strong><span>Indoor pool</span></span>'),
            ],
            'redesign-site/facilities.html': [
              ('The pool and wellness spaces are part of the stay, not an afterthought. Explore the actual facilities, opening information and guest guidelines below.', 'Swim from 07:00 to 23:00, slow down after a day in Mechelen and find the practical details for pool access, towels and our upcoming spa.'),
            ],
            'redesign-site/info.html': [
              ('Everything useful for your stay, organised like a concierge desk.', 'Find check-in and check-out times, breakfast hours, parking details, payment options, hotel services and the traffic rules around central Mechelen.'),
            ],
            'redesign-site/attractions.html': [
              ('Hotel Elisabeth sits close enough to Mechelen’s historic centre that discovering the city can begin the moment you leave the lobby.', 'Step outside the hotel and discover Mechelen by boat, visit historic sites and local favourites, or make time for a brewery visit while you are in the city.'),
              ('From the Dijle to centuries of architecture, the hotel’s current recommendations become a visual route through the city.', 'Walk along the Dijle, discover centuries of architecture, visit a local brewery or see the city from the water - there is plenty to fill a few hours or an entire day.'),
            ],
            'redesign-site/grouprequest.html': [
              ('Tell us the shape of the group first. We will collect the room mix, occasion and contact details step by step.', 'Travelling with colleagues, family, friends or a tour group? Share your dates, group size and room needs and our team will prepare a proposal for your stay.'),
            ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected source copy not found in {filename}: {old[:80]}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(filename)

          workflow = Path('.github/workflows/polish-redesign-source-once.yml')
          workflow.unlink()
          print('Polished:', ', '.join(changed))
          PY

      - name: Commit source polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site .github/workflows/polish-redesign-source-once.yml
          git commit -m 'copy: polish guest-facing source text'
          git push origin HEAD:elisabeth-redesign
