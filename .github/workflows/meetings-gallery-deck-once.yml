name: Meetings gallery deck once

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/meetings-gallery-deck-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0
      - name: Apply gallery deck
        run: python tools/patch_meetings_gallery_deck.py
      - name: Check JavaScript
        run: node --check redesign-site/assets/meetings.js
      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/assets/meetings.js redesign-site/assets/meetings-studio.css
          git diff --cached --quiet && exit 0
          git commit -m 'design: turn meetings into horizontal gallery deck'
          git push origin HEAD:elisabeth-redesign
