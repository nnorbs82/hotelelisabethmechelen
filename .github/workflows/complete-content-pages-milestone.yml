name: Complete facilities packages meetings milestone

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/complete-content-pages-milestone.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Connect existing navigation to real pages
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
            'index.html#facilities':'facilities.html',
            'index.html#packages':'packages.html',
            'index.html#meetings':'meetings.html',
          }
          for name in ['redesign-site/index.html','redesign-site/rooms.html']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              for old,new in replacements.items(): text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')
          PY

      - name: Validate scripts
        run: |
          node --check redesign-site/assets/site.js
          node --check redesign-site/assets/home.js
          node --check redesign-site/assets/rooms.js
          node --check redesign-site/assets/facilities.js
          node --check redesign-site/assets/packages.js
          node --check redesign-site/assets/meetings.js

      - name: Validate pages and local references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re
          pages=['index.html','rooms.html','facilities.html','packages.html','meetings.html']
          class Parser(HTMLParser): pass
          for name in pages:
              p=Path('redesign-site')/name
              html=p.read_text(encoding='utf-8')
              Parser().feed(html)
              if 'noindex,nofollow' not in html.replace(' ',''):
                  raise SystemExit(f'{name}: preview noindex missing')
              if 'firebase-config.js' in html:
                  raise SystemExit(f'{name}: runtime Firebase reference found')
              for attr,value in re.findall(r'\b(src|href)=["\']([^"\']+)["\']',html,re.I):
                  if value.startswith(('#','http://','https://','mailto:','tel:','data:')): continue
                  local=value.split('?',1)[0].split('#',1)[0]
                  if not local: continue
                  target=(p.parent/local).resolve()
                  if not target.exists(): raise SystemExit(f'{name}: missing local reference {value}')
          for path in Path('redesign/legacy-content').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('Content-page milestone validated')
          PY

      - name: Guard production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time workflow
        run: rm .github/workflows/complete-content-pages-milestone.yml

      - name: Commit validated milestone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/index.html redesign-site/rooms.html .github/workflows/complete-content-pages-milestone.yml
          git commit -m 'build: connect and validate facilities packages meetings pages'
          git push origin HEAD:elisabeth-redesign
