name: Add missing page descriptions once

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/add-page-descriptions-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0
      - name: Add meta descriptions
        run: |
          python - <<'PY'
          from pathlib import Path
          pages={
            'redesign-site/careers.html':'Explore career opportunities at Hotel Elisabeth Mechelen or send an open application to join our hospitality team.',
            'redesign-site/policies.html':'Review practical Hotel Elisabeth Mechelen policies for check-in, check-out, parking, payments, city access and your stay.',
            'redesign-site/privacy.html':'Read how Hotel Elisabeth Mechelen handles personal data and protects guest information.',
            'redesign-site/terms.html':'Read the terms and conditions that apply when booking or staying at Hotel Elisabeth Mechelen.'
          }
          for filename,description in pages.items():
              path=Path(filename)
              text=path.read_text(encoding='utf-8')
              if 'name="description"' in text:
                  continue
              anchor='<meta name="theme-color" content="#070807">'
              if anchor not in text:
                  raise SystemExit(f'Meta insertion point missing: {filename}')
              text=text.replace(anchor,f'<meta name="description" content="{description}">\n  {anchor}',1)
              path.write_text(text,encoding='utf-8')
          PY
      - name: Commit descriptions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/careers.html redesign-site/policies.html redesign-site/privacy.html redesign-site/terms.html
          git diff --cached --quiet && exit 0
          git commit -m 'seo: add descriptions to careers and policy pages'
          git push origin HEAD:elisabeth-redesign
