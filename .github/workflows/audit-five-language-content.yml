name: Audit five-language CMS content

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/audit-five-language-content.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Audit multilingual CMS fields and runtime dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('redesign-site/content')
          langs=('en','nl','fr','es','de')
          specs={
            'rooms': ('name','bedType','description'),
            'packages': ('title','description','inclusions','goodToKnow'),
            'facilities': ('name','operation','guidelines'),
            'meetings': ('name','description','setupStyles','facilities','foodDrinks','parking','accommodation'),
            'attractions': ('title','description'),
          }
          missing=[]
          totals={}
          for collection, bases in specs.items():
            files=sorted((root/collection).glob('*.json'))
            totals[collection]=len(files)
            for path in files:
              data=json.loads(path.read_text(encoding='utf-8'))
              ident=data.get('id') or path.stem
              for base in bases:
                # Only require a translated field if English source exists.
                en=data.get(f'{base}_en')
                if en in (None,'',[]):
                  continue
                for lang in ('nl','fr','es','de'):
                  value=data.get(f'{base}_{lang}')
                  if value in (None,'',[]):
                    missing.append(f'{collection}/{ident}: {base}_{lang}')

          info=json.loads((root/'hotel-info.json').read_text(encoding='utf-8'))
          totals['hotel-info']=len(info.get('entries',[]))
          for entry in info.get('entries',[]):
            ident=entry.get('id','unknown')
            if entry.get('body_en'):
              for lang in ('nl','fr','es','de'):
                if not entry.get(f'body_{lang}'):
                  missing.append(f'hotel-info/{ident}: body_{lang}')

          for legal in ('privacy','terms'):
            data=json.loads((root/f'{legal}.json').read_text(encoding='utf-8'))
            totals[legal]=1
            for lang in langs:
              if not data.get(lang): missing.append(f'{legal}: {lang}')

          homepage=json.loads((root/'homepage.json').read_text(encoding='utf-8'))
          totals['homepage']=1
          home_bases=['heroEyebrow','heroTitle','heroBody','manifestoEyebrow','manifestoLine1','manifestoLine2','manifestoSubtitle','manifestoBody','closingEyebrow','closingTitle']
          for base in home_bases:
            if homepage.get(f'{base}_en'):
              for lang in ('nl','fr','es','de'):
                if not homepage.get(f'{base}_{lang}'):
                  missing.append(f'homepage: {base}_{lang}')

          print('CMS collection totals:', totals)
          if missing:
            print('MISSING_TRANSLATIONS_START')
            for item in missing: print(item)
            print('MISSING_TRANSLATIONS_END')
          else:
            print('FIVE_LANGUAGE_CONTENT_COMPLETE')

          # Check editable and generated content for remaining Firebase Storage URLs.
          firebase=[]
          for folder in [root, root/'generated']:
            for path in folder.rglob('*.json'):
              text=path.read_text(encoding='utf-8',errors='ignore')
              if 'firebasestorage.googleapis.com' in text:
                firebase.append(str(path))
          print('FIREBASE_CONTENT_FILES_START')
          for item in firebase: print(item)
          print('FIREBASE_CONTENT_FILES_END')
          PY

      - name: Guard live production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time audit workflow
        run: rm .github/workflows/audit-five-language-content.yml

      - name: Commit audit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-five-language-content.yml
          git commit -m 'chore: complete five-language content audit'
          git push origin HEAD:elisabeth-redesign
