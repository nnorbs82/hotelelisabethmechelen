name: Validate cinematic rooms redesign

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/validate-cinematic-rooms.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Validate JavaScript
        run: node --check redesign-site/assets/rooms.js

      - name: Validate rooms page and data
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re

          html_path=Path('redesign-site/rooms.html')
          html=html_path.read_text(encoding='utf-8')
          HTMLParser().feed(html)
          assert 'noindex,nofollow' in html.replace(' ',''), 'Rooms preview lost noindex'
          for token in ['room-journey','room-journey-rail','room-journey-visuals','room-mobile-collection','room-compare-table','rooms-experience.css']:
              assert token in html, f'Missing rooms experience hook: {token}'

          for attr,value in re.findall(r'\b(src|href)=["\']([^"\']+)["\']',html,re.I):
              if value.startswith(('#','http://','https://','mailto:','tel:','data:')): continue
              local=(html_path.parent/value.split('?',1)[0].split('#',1)[0]).resolve()
              assert local.exists(), f'Missing local reference: {value}'

          rooms=json.loads(Path('redesign/legacy-content/rooms.json').read_text(encoding='utf-8'))
          published=[r for r in rooms.values() if r.get('status','available')=='available']
          assert len(published)>=1, 'No published rooms found'
          assert all('photos' in r for r in published), 'Published room without photo collection'

          js=Path('redesign-site/assets/rooms.js').read_text(encoding='utf-8')
          for token in ['scrollToRoom','updateJourneyFromScroll','data-journey-photo','data-open-room','room-dialog-main-nav','renderCompare','renderMobile']:
              assert token in js, f'Missing room JS behavior: {token}'

          css=Path('redesign-site/assets/rooms-experience.css').read_text(encoding='utf-8')
          for token in ['.room-journey-sticky','.room-journey-rail','.room-journey-gallery','.room-mobile-collection','.room-compare-row']:
              assert token in css, f'Missing room CSS behavior: {token}'
          print(f'Cinematic rooms validation passed for {len(published)} published room categories')
          PY

      - name: Guard production branch
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time workflow
        run: rm .github/workflows/validate-cinematic-rooms.yml

      - name: Commit validation cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: complete cinematic rooms validation'
          git push origin HEAD:elisabeth-redesign
