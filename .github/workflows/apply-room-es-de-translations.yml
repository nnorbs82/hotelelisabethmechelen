name: Apply room ES and DE translations

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/apply-room-es-de-translations.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Apply room translations
        run: python tools/apply_room_es_de_translations.py

      - name: Rebuild browser content indexes
        run: python tools/build_redesign_content.py

      - name: Validate every room translation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rooms=list(Path('redesign-site/content/rooms').glob('*.json'))
          if len(rooms)!=10: raise SystemExit(f'Expected 10 room records, got {len(rooms)}')
          for path in rooms:
              item=json.loads(path.read_text(encoding='utf-8'))
              for lang in ['es','de']:
                  for field in ['name','bedType','description']:
                      key=f'{field}_{lang}'
                      if not item.get(key): raise SystemExit(f'Missing {key}: {path}')
          generated=json.loads(Path('redesign-site/content/generated/rooms.json').read_text(encoding='utf-8'))
          if len(generated)!=10: raise SystemExit('Generated room index count mismatch')
          print('All 10 room records have ES/DE content')
          PY

      - name: Validate Rooms JavaScript
        run: node --check redesign-site/assets/rooms.js

      - name: Guard production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time translation files
        run: rm .github/workflows/apply-room-es-de-translations.yml tools/apply_room_es_de_translations.py

      - name: Commit room translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/content .github/workflows/apply-room-es-de-translations.yml tools/apply_room_es_de_translations.py
          git commit -m 'content: add Spanish and German room translations'
          git push origin HEAD:elisabeth-redesign
