name: Clean legacy Firebase media metadata

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/clean-legacy-firebase-media.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Verify local media and remove Firebase fallbacks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('redesign-site/content')
          repo=Path('.')
          changed=[]

          def save(path,data):
            path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
            changed.append(str(path))

          def verify_media(path_value, where):
            if not isinstance(path_value,str) or not path_value.startswith('/images/elisabeth/'):
              raise SystemExit(f'{where}: local media path missing or invalid: {path_value!r}')
            local=repo/path_value.lstrip('/')
            if not local.exists(): raise SystemExit(f'{where}: local media file missing: {local}')

          for path in sorted((root/'rooms').glob('*.json')):
            data=json.loads(path.read_text(encoding='utf-8'))
            gallery=data.get('gallery') or []
            if not gallery: raise SystemExit(f'{path}: room gallery missing')
            for image in gallery: verify_media(image,path)
            if 'photos' in data:
              data.pop('photos',None); save(path,data)

          for path in sorted((root/'packages').glob('*.json')):
            data=json.loads(path.read_text(encoding='utf-8'))
            verify_media(data.get('image'),path)
            if 'imageUrl' in data:
              data.pop('imageUrl',None); save(path,data)

          for collection in ('facilities','meetings'):
            for path in sorted((root/collection).glob('*.json')):
              data=json.loads(path.read_text(encoding='utf-8'))
              gallery=data.get('gallery') or []
              if not gallery: raise SystemExit(f'{path}: gallery missing')
              for image in gallery: verify_media(image,path)
              removed=False
              for key in ('legacyPhotos','photos'):
                if key in data:
                  data.pop(key,None); removed=True
              if removed: save(path,data)

          for path in sorted((root/'attractions').glob('*.json')):
            data=json.loads(path.read_text(encoding='utf-8'))
            verify_media(data.get('imageFile'),path)
            old=data.get('image')
            if old is not None:
              data.pop('image',None); save(path,data)

          print(f'Cleaned legacy media metadata in {len(changed)} CMS files')
          for item in changed: print(item)
          PY

      - name: Rebuild generated content
        run: python tools/build_redesign_content.py

      - name: Assert CMS and generated content contain no Firebase Storage URLs
        run: |
          if grep -R -n 'firebasestorage.googleapis.com' redesign-site/content; then
            echo 'Firebase Storage URL remains in CMS content' >&2
            exit 1
          fi

      - name: Assemble and validate production output
        run: |
          python tools/build_production_site.py dist
          if grep -R -n 'firebasestorage.googleapis.com' dist; then
            echo 'Firebase Storage URL remains in production output' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          required=['index.html','rooms.html','facilities.html','packages.html','meetings.html','info.html','attractions.html','grouprequest.html','careers.html','policies.html','privacypolicy.html','termsandconditions.html']
          for name in required:
            if not Path('dist',name).exists(): raise SystemExit('Missing production page '+name)
          print('Production output remains complete')
          PY

      - name: Guard live production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time cleanup workflow
        run: rm .github/workflows/clean-legacy-firebase-media.yml

      - name: Commit clean CMS media state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/content .github/workflows/clean-legacy-firebase-media.yml
          git commit -m 'content: remove legacy Firebase media metadata'
          git push origin HEAD:elisabeth-redesign
