name: Apply attraction ES and DE translations

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/apply-attraction-es-de-translations.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Apply attraction translations
        run: python tools/apply_attraction_es_de_translations.py

      - name: Rebuild browser content indexes
        run: python tools/build_redesign_content.py

      - name: Validate every attraction translation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('redesign-site/content/attractions').glob('*.json'))
          if len(files)!=5: raise SystemExit(f'Expected 5 attraction records, got {len(files)}')
          for path in files:
              item=json.loads(path.read_text(encoding='utf-8'))
              for lang in ['es','de']:
                  for field in ['title','description']:
                      if not item.get(f'{field}_{lang}'):
                          raise SystemExit(f'Missing {field}_{lang}: {path}')
          generated=json.loads(Path('redesign-site/content/generated/attractions.json').read_text(encoding='utf-8'))
          if len(generated)!=5: raise SystemExit('Generated attraction count mismatch')
          print('All 5 attraction records have ES/DE content')
          PY

      - name: Validate Attractions JavaScript
        run: node --check redesign-site/assets/attractions.js

      - name: Guard production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time translation files
        run: rm .github/workflows/apply-attraction-es-de-translations.yml tools/apply_attraction_es_de_translations.py

      - name: Commit attraction translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site/content .github/workflows/apply-attraction-es-de-translations.yml tools/apply_attraction_es_de_translations.py
          git commit -m 'content: add Spanish and German attraction translations'
          git push origin HEAD:elisabeth-redesign
