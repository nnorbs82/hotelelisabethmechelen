name: Harden Elisabeth redesign

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/harden-redesign.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Apply production hardening
        run: python tools/harden_redesign.py

      - name: Validate scripts and CMS configuration
        run: |
          for file in redesign-site/assets/*.js; do node --check "$file"; done
          ruby -e "require 'yaml'; YAML.load_file('.pages.yml'); puts 'Pages CMS YAML valid'"

      - name: Validate accessibility and form hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=list(Path('redesign-site').glob('*.html'))
          for p in pages:
              text=p.read_text(encoding='utf-8')
              if 'class="skip-link"' not in text: raise SystemExit(f'Missing skip link: {p}')
              if 'id="main-content"' not in text: raise SystemExit(f'Missing main target: {p}')
              if 'name="theme-color"' not in text: raise SystemExit(f'Missing theme color: {p}')
          meetings=Path('redesign-site/meetings.html').read_text(encoding='utf-8')
          group=Path('redesign-site/grouprequest.html').read_text(encoding='utf-8')
          for token in ['autocomplete="given-name"','autocomplete="family-name"','autocomplete="email"','autocomplete="tel"']:
              if token not in meetings: raise SystemExit(f'Meetings missing {token}')
              if token not in group: raise SystemExit(f'Group request missing {token}')
          if 'id="consent" name="consent"' not in group and 'name="consent"' not in group:
              raise SystemExit('Group consent checkbox missing form name')
          if 'Production accessibility hardening' not in Path('redesign-site/assets/site.css').read_text(encoding='utf-8'):
              raise SystemExit('Accessibility CSS missing')
          if 'skipLabels' not in Path('redesign-site/assets/site.js').read_text(encoding='utf-8'):
              raise SystemExit('Skip-link translations missing')
          print('Accessibility and form hardening validated')
          PY

      - name: Validate caching and media budget
        run: |
          if grep -R --include='*.js' -n "cache.*no-store" redesign-site/assets; then
            echo 'Development no-store caching remains in production code' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          files=[p for p in Path('images/elisabeth').rglob('*') if p.is_file()]
          total=sum(p.stat().st_size for p in files)
          largest=sorted(files,key=lambda p:p.stat().st_size,reverse=True)[:10]
          print(f'Git-managed Elisabeth media: {len(files)} files, {total/1024/1024:.2f} MiB total')
          print('Largest files:')
          for p in largest:
              print(f'  {p}: {p.stat().st_size/1024:.1f} KiB')
          over=[p for p in files if p.stat().st_size > 2_500_000]
          if over:
              raise SystemExit('Media file exceeds 2.5 MB budget: '+', '.join(str(p) for p in over))
          PY

      - name: Validate form delivery configuration is preserved
        run: |
          grep -q "service_iu8cxtm" redesign-site/assets/meetings.js
          grep -q "template_8txu2md" redesign-site/assets/meetings.js
          grep -q "service_iu8cxtm" redesign-site/assets/grouprequest.js
          grep -q "template_3syt07l" redesign-site/assets/grouprequest.js
          grep -q "privacyConsent" redesign-site/meetings.html
          grep -q "single-rooms" redesign-site/grouprequest.html
          grep -q "triple-rooms" redesign-site/grouprequest.html
          grep -q "meal-option" redesign-site/grouprequest.html

      - name: Guard production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time hardening files
        run: rm .github/workflows/harden-redesign.yml tools/harden_redesign.py

      - name: Commit hardening milestone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redesign-site .github/workflows/harden-redesign.yml tools/harden_redesign.py
          git commit -m 'qa: harden redesign accessibility forms and caching'
          git push origin HEAD:elisabeth-redesign
