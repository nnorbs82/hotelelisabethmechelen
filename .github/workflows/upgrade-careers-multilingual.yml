name: Upgrade Careers multilingual CMS

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/upgrade-careers-multilingual.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Upgrade Careers schema and UI
        run: python tools/upgrade_careers_multilingual.py

      - name: Validate CMS YAML and Careers JS
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.pages.yml'); puts 'Pages CMS YAML valid'"
          node --check redesign-site/assets/careers.js
          grep -q 'title_es' .pages.yml
          grep -q 'requirements_de' .pages.yml
          grep -q "employmentType" redesign-site/assets/careers.js

      - name: Guard production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time upgrade files
        run: rm .github/workflows/upgrade-careers-multilingual.yml tools/upgrade_careers_multilingual.py

      - name: Commit Careers upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pages.yml redesign-site/assets/careers.js .github/workflows/upgrade-careers-multilingual.yml tools/upgrade_careers_multilingual.py
          git commit -m 'cms: make Careers vacancies fully multilingual'
          git push origin HEAD:elisabeth-redesign
