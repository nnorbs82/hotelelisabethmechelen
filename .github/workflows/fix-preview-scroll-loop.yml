name: Fix preview offsets and hero loop

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/fix-preview-scroll-loop.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Apply alignment and slideshow fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('design-preview-v2.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('html{scroll-behavior:smooth;scroll-padding-top:92px}', 'html{scroll-behavior:smooth;scroll-padding-top:118px}', 1)
          css = css.replace('.anchor-marker{scroll-margin-top:88px}', '.anchor-marker{scroll-margin-top:118px}', 1)
          css = css.replace('.transition-layer{position:absolute;inset:0;height:100%;overflow:hidden;padding:68px 0 54px}', '.transition-layer{position:absolute;inset:0;height:100%;overflow:hidden;padding:126px 0 54px}', 1)
          css = css.replace('.transition-layer{position:relative;height:auto;overflow:visible;padding:95px 0;transform:none!important;pointer-events:auto!important}', '.transition-layer{position:relative;height:auto;overflow:visible;padding:112px 0 95px;transform:none!important;pointer-events:auto!important}', 1)
          css += '\n/* Header-safe section alignment */\n.section.anchor-marker:not(.hero){scroll-margin-top:118px}\n@media(max-width:760px){html{scroll-padding-top:92px}.anchor-marker,.section.anchor-marker:not(.hero){scroll-margin-top:92px}}\n'
          css_path.write_text(css, encoding='utf-8')

          js_path = Path('design-preview-v2.js')
          js = js_path.read_text(encoding='utf-8')
          old = """  document.querySelector('.hero-prev')?.addEventListener('click',()=>showSlide(slideIndex-1));\n  document.querySelector('.hero-next')?.addEventListener('click',()=>showSlide(slideIndex+1));\n  let slideTimer=setInterval(()=>showSlide(slideIndex+1),6500);\n  document.querySelector('.hero')?.addEventListener('mouseenter',()=>clearInterval(slideTimer));\n  document.querySelector('.hero')?.addEventListener('mouseleave',()=>{clearInterval(slideTimer);slideTimer=setInterval(()=>showSlide(slideIndex+1),6500);});\n  showSlide(0);\n"""
          new = """  let slideTimer;\n  const restartSlideTimer=()=>{\n    clearInterval(slideTimer);\n    slideTimer=setInterval(()=>showSlide(slideIndex+1),6500);\n  };\n  document.querySelector('.hero-prev')?.addEventListener('click',()=>{showSlide(slideIndex-1);restartSlideTimer();});\n  document.querySelector('.hero-next')?.addEventListener('click',()=>{showSlide(slideIndex+1);restartSlideTimer();});\n  showSlide(0);\n  restartSlideTimer();\n"""
          if old not in js:
              raise SystemExit('Expected hero slideshow block was not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')
          PY

      - name: Validate preview
        run: |
          node --check design-preview-v2.js
          python - <<'PY'
          from pathlib import Path
          css=Path('design-preview-v2.css').read_text(encoding='utf-8')
          js=Path('design-preview-v2.js').read_text(encoding='utf-8')
          html=Path('design-preview-v2.html').read_text(encoding='utf-8')
          checks = {
            'desktop scroll padding':'scroll-padding-top:118px' in css,
            'desktop anchor offset':'scroll-margin-top:118px' in css,
            'transition top clearance':'padding:126px 0 54px' in css,
            'no hover pause':"mouseenter',()=>clearInterval(slideTimer)" not in js,
            'loop restart':'restartSlideTimer' in js,
            'preview noindex':'noindex,nofollow' in html.replace(' ', '')
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('Failed checks: '+', '.join(failed))
          print('Preview alignment and slideshow loop validated')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-preview-scroll-loop.yml

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align sections below header and keep hero looping'
          git push origin HEAD:elisabeth-redesign
