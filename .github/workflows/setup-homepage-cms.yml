name: Complete Homepage CMS integration

on:
  push:
    branches: [elisabeth-redesign]
    paths:
      - '.github/workflows/setup-homepage-cms.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elisabeth-redesign
          fetch-depth: 0

      - name: Copy approved homepage photography into CMS media
        run: |
          mkdir -p images/elisabeth/home
          cp mainslide/*.webp images/elisabeth/home/

      - name: Wire homepage into Pages CMS and static builder
        run: python tools/setup_homepage_cms.py

      - name: Rebuild generated content
        run: python tools/build_redesign_content.py

      - name: Validate CMS and JavaScript
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.pages.yml'); puts 'Pages CMS YAML valid'"
          node --check redesign-site/assets/home.js
          node --check design-preview-v2.js

      - name: Validate homepage content and media
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path('redesign-site/content/homepage.json')
          generated=Path('redesign-site/content/generated/homepage.json')
          if not source.exists() or not generated.exists(): raise SystemExit('Homepage source/generated content missing')
          home=json.loads(source.read_text(encoding='utf-8'))
          built=json.loads(generated.read_text(encoding='utf-8'))
          multilingual=['heroEyebrow','heroTitle','heroBody','manifestoEyebrow','manifestoLine1','manifestoLine2','manifestoSubtitle','manifestoBody','closingEyebrow','closingTitle']
          for field in multilingual:
              for lang in ['en','nl','fr','es','de']:
                  if not home.get(f'{field}_{lang}'):
                      raise SystemExit(f'Missing homepage {field}_{lang}')
          if not (2 <= len(home.get('heroImages',[])) <= 8): raise SystemExit('Homepage slideshow must contain 2-8 images')
          if len(home.get('paceImages',[])) != 3: raise SystemExit('Homepage atmosphere ribbon must contain exactly 3 images')
          if len(home.get('facts',[])) != 4: raise SystemExit('Homepage facts must contain exactly 4 entries')
          for field in ['heroImages','paceImages']:
              for item in home[field]:
                  media=Path(item['image'].lstrip('/'))
                  if not media.exists(): raise SystemExit(f'Missing homepage media: {media}')
          closing=Path(home['closingImage'].lstrip('/'))
          if not closing.exists(): raise SystemExit(f'Missing closing media: {closing}')
          if not all(str(item.get('image','')).startswith('../images/elisabeth/home/') for item in built['heroImages']):
              raise SystemExit('Generated homepage hero media paths are not preview-safe')
          if not str(built.get('closingImage','')).startswith('../images/elisabeth/home/'):
              raise SystemExit('Generated homepage closing image path is not preview-safe')
          print('Homepage CMS content and media validated')
          PY

      - name: Validate homepage integration hooks
        run: |
          grep -q 'data-home="heroTitle"' redesign-site/index.html
          grep -q 'data-home-manifesto-title' redesign-site/index.html
          grep -q 'id="home-facts"' redesign-site/index.html
          grep -q 'class="hero-total"' redesign-site/index.html
          grep -q 'data-home-pace="2"' redesign-site/index.html
          grep -q 'data-home-closing-image' redesign-site/index.html
          grep -q "hero slideshow - prototype only" design-preview-v2.js
          grep -q "document.body.classList.contains('actual-site')" design-preview-v2.js
          grep -q "homepage.json" tools/build_redesign_content.py
          grep -q "homepage.json" .github/workflows/rebuild-redesign-content.yml
          grep -q "name: homepage" .pages.yml
          grep -q "name: home_images" .pages.yml

      - name: Guard production branch
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "b881ebc93db57d2409024e9664b0942f62a5e94c"

      - name: Remove one-time integration files
        run: rm .github/workflows/setup-homepage-cms.yml tools/setup_homepage_cms.py

      - name: Commit homepage CMS milestone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pages.yml design-preview-v2.js redesign-site/index.html redesign-site/content/generated tools/build_redesign_content.py .github/workflows/rebuild-redesign-content.yml .github/workflows/validate-redesign.yml images/elisabeth/home .github/workflows/setup-homepage-cms.yml tools/setup_homepage_cms.py
          git commit -m 'cms: complete editable homepage content system'
          git push origin HEAD:elisabeth-redesign
