  - name: package_images
    label: Package photography
    input: images/elisabeth/packages
    output: /images/elisabeth/packages
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: facility_images
    label: Facilities photography
    input: images/elisabeth/facilities
    output: /images/elisabeth/facilities
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: meeting_images
    label: Meetings photography
    input: images/elisabeth/meetings
    output: /images/elisabeth/meetings
    extensions: [jpg, jpeg, png, webp]
    rename: safe
