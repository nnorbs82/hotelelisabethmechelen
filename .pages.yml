          - { name: title_de, label: "Heading - German", type: string }
          - { name: body_de, label: "Content - German", type: text }

  - name: careers
    label: Careers
    type: collection
    path: redesign-site/content/careers
    exclude: [.gitkeep]
    format: json
    filename:
      template: "{primary}.json"
      field: false
    subfolders: false
    view:
