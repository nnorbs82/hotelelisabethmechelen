  - name: hotel_information
    label: Hotel information
    type: file
    path: redesign-site/content/hotel-info.json
    format: json
    fields:
      - name: entries
        label: Information topics
        type: object
        list: true
        fields:
          - { name: id, label: Internal ID, type: string, readonly: true }
          - { name: order, label: Display order, type: number }
          - { name: title_en, label: "Heading - English", type: string }
          - { name: body_en, label: "Content - English", type: text }
          - { name: title_nl, label: "Heading - Dutch", type: string }
