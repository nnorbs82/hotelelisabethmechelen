      - { name: legacyPhotos, label: Legacy photo records, type: object, list: true, hidden: true, fields: [{ name: url, type: string }, { name: filename, type: string }, { name: order, type: number }] }

  - name: city
    label: Explore Mechelen
    type: collection
    path: redesign-site/content/attractions
    format: json
    filename:
      template: "{primary}.json"
      field: false
    subfolders: false
    view:
      primary: title_en
      fields: [title_en, order]
      sort: [order, title_en]
      default: { sort: order, order: asc }
    fields:
      - { name: id, label: Internal ID, type: string, hidden: true }
      - { name: order, label: Display order, type: number, required: true }
      - { name: title_en, label: "Title - English", type: string, required: true }
      - { name: title_nl, label: "Title - Dutch", type: string }
      - { name: title_fr, label: "Title - French", type: string }
      - { name: title_es, label: "Title - Spanish", type: string }
      - { name: title_de, label: "Title - German", type: string }
      - { name: description_en, label: "Description - English", type: text }
