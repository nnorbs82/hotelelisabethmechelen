      - { name: setupStyles_es, label: "Room layouts - Spanish", type: string, list: true }
      - { name: setupStyles_de, label: "Room layouts - German", type: string, list: true }
      - { name: facilities_en, label: "Equipment - English", type: string, list: true }
      - { name: facilities_nl, label: "Equipment - Dutch", type: string, list: true }
      - { name: facilities_fr, label: "Equipment - French", type: string, list: true }
      - { name: facilities_es, label: "Equipment - Spanish", type: string, list: true }
      - { name: facilities_de, label: "Equipment - German", type: string, list: true }
      - { name: food_en, label: "Food & drink - English", type: text }
      - { name: food_nl, label: "Food & drink - Dutch", type: text }
      - { name: food_fr, label: "Food & drink - French", type: text }
      - { name: food_es, label: "Food & drink - Spanish", type: text }
      - { name: food_de, label: "Food & drink - German", type: text }
      - { name: parking_en, label: "Parking - English", type: text }
      - { name: parking_nl, label: "Parking - Dutch", type: text }
