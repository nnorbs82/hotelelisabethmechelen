    rename: safe

content:
  - name: accommodation
    label: Rooms & accommodation
    type: group
    items:
      - name: amenities
        label: Room amenities
        type: collection
        path: redesign-site/content/amenities
        format: json
        filename:
          template: "{primary}.json"
          field: false
        subfolders: false
        view:
          primary: name_en
          fields: [name_en, name_nl, name_fr]
          sort: [name_en]
          default: { sort: name_en, order: asc }
        fields:
          - { name: id, label: Internal ID, type: string, hidden: true }
          - { name: order, label: Display order, type: number }
          - { name: name_en, label: "Name - English", type: string, required: true }
          - { name: name_nl, label: "Name - Dutch", type: string }
          - { name: name_fr, label: "Name - French", type: string }
          - { name: name_es, label: "Name - Spanish", type: string }
          - { name: name_de, label: "Name - German", type: string }

      - name: rooms
        label: Rooms & suites
        type: collection
        path: redesign-site/content/rooms
        format: json
        filename:
          template: "{primary}.json"
          field: false
        subfolders: false
        view:
          primary: name_en
          fields: [name_en, status, order, roomSize, maxOccupancy]
          sort: [order, name_en]
          default: { sort: order, order: asc }
        fields:
          - { name: id, label: Internal ID, type: string, hidden: true }
          - { name: order, label: Display order, type: number, required: true }
          - name: status
            label: Website status
            type: select
            required: true
            options:
              values:
                - { name: available, label: Visible / available }
                - { name: offline, label: Hidden / offline }
                - { name: unavailable, label: Hidden / unavailable }
          - { name: maxOccupancy, label: Maximum occupancy, type: number }
          - { name: roomSize, label: Room size in m², type: number }
          - { name: name_en, label: "Room name - English", type: string, required: true }
          - { name: name_nl, label: "Room name - Dutch", type: string }
          - { name: name_fr, label: "Room name - French", type: string }
          - { name: name_es, label: "Room name - Spanish", type: string }
          - { name: name_de, label: "Room name - German", type: string }
          - { name: bedType_en, label: "Bed type - English", type: string }
          - { name: bedType_nl, label: "Bed type - Dutch", type: string }
          - { name: bedType_fr, label: "Bed type - French", type: string }
          - { name: bedType_es, label: "Bed type - Spanish", type: string }
          - { name: bedType_de, label: "Bed type - German", type: string }
          - { name: description_en, label: "Description - English", type: text }
          - { name: description_nl, label: "Description - Dutch", type: text }
          - { name: description_fr, label: "Description - French", type: text }
          - { name: description_es, label: "Description - Spanish", type: text }
          - { name: description_de, label: "Description - German", type: text }
          - name: amenityIds
            label: Amenities
            type: reference
            options:
              collection: amenities
              multiple: true
              search: "name_en,name_nl,name_fr"
              value: "{name}"
              label: "{fields.name_en}"
          - name: gallery
            label: Room gallery
            type: image
            options:
              media: room_images
              multiple: { max: 30 }
              unique: true
              extensions: [jpg, jpeg, png, webp]
          - { name: videoUrl, label: Video URL, type: string }

  - name: offers
    label: Packages & offers
    type: collection
    path: redesign-site/content/packages
    format: json
    filename:
      template: "{primary}.json"
      field: false
    subfolders: false
    view:
      primary: title_en
      fields: [title_en, status, showInOurPicks, order]
      sort: [order, title_en]
      default: { sort: order, order: asc }
    fields:
      - { name: id, label: Internal ID, type: string, hidden: true }
      - { name: order, label: Display order, type: number, required: true }
      - name: status
        label: Website status
        type: select
        required: true
        options:
          values:
            - { name: active, label: Active }
            - { name: inactive, label: Inactive }
      - { name: showInOurPicks, label: Show on homepage, type: boolean }
      - { name: title_en, label: "Title - English", type: string, required: true }
      - { name: title_nl, label: "Title - Dutch", type: string }
      - { name: title_fr, label: "Title - French", type: string }
      - { name: title_es, label: "Title - Spanish", type: string }
      - { name: title_de, label: "Title - German", type: string }
      - { name: description_en, label: "Description - English", type: text }
      - { name: description_nl, label: "Description - Dutch", type: text }
      - { name: description_fr, label: "Description - French", type: text }
      - { name: description_es, label: "Description - Spanish", type: text }
      - { name: description_de, label: "Description - German", type: text }
      - { name: inclusions_en, label: "Inclusions - English", type: text }
      - { name: inclusions_nl, label: "Inclusions - Dutch", type: text }
      - { name: inclusions_fr, label: "Inclusions - French", type: text }
      - { name: inclusions_es, label: "Inclusions - Spanish", type: text }
      - { name: inclusions_de, label: "Inclusions - German", type: text }
      - { name: goodToKnow_en, label: "Good to know - English", type: text }
      - { name: goodToKnow_nl, label: "Good to know - Dutch", type: text }
      - { name: goodToKnow_fr, label: "Good to know - French", type: text }
      - { name: goodToKnow_es, label: "Good to know - Spanish", type: text }
      - { name: goodToKnow_de, label: "Good to know - German", type: text }
      - name: image
        label: Main package image
        type: image
        options: { media: package_images, extensions: [jpg, jpeg, png, webp] }
      - { name: imageUrl, label: Legacy image URL, type: string, hidden: true }
      - { name: bookingLink, label: Mews package booking URL, type: string }

  - name: facilities
    label: Facilities
    type: collection
    path: redesign-site/content/facilities
    format: json
    filename:
      template: "{primary}.json"
      field: false
    subfolders: false
    view:
