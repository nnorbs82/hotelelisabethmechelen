      - { name: guidelines_de, label: "Guest guidelines - German", type: string, list: true }
      - name: gallery
        label: Facility gallery
        type: image
        options:
          media: facility_images
          multiple: { max: 30 }
          unique: true
          extensions: [jpg, jpeg, png, webp]
      - { name: legacyPhotos, label: Legacy photo records, type: object, list: true, hidden: true, fields: [{ name: url, type: string }, { name: filename, type: string }, { name: order, type: number }] }

  - name: meetings
