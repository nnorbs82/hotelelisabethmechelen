      - { name: name_fr, label: "Name - French", type: string }
      - { name: name_es, label: "Name - Spanish", type: string }
      - { name: name_de, label: "Name - German", type: string }
      - { name: operation_en, label: "Practical information - English", type: text }
      - { name: operation_nl, label: "Practical information - Dutch", type: text }
      - { name: operation_fr, label: "Practical information - French", type: text }
